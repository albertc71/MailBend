# Secret-scanning rules for scripts/scan-secrets.sh (run in CI): gitleaks'
# default rules plus the shape of an Apple app-specific password, the secret
# MailBend is configured with. Only the documented placeholder is allowed.
title = "MailBend"

[extend]
useDefault = true

[[rules]]
id = "apple-app-specific-password"
description = "Apple app-specific password"
regex = '''\b[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}\b'''

[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^xxxx-xxxx-xxxx-xxxx$''']

# The fake keys that test MailBend's own secret scan before a send.
[[allowlists]]
description = "secret-scan fixtures"
paths = ['''^src/secrets\.bend$''', '''^tests/unit/secrets\.bend$''']

[[allowlists]]
description = "fake keys in the end-to-end tests"
regexes = ['''fakefake''', '''^ts_test_key_''']
