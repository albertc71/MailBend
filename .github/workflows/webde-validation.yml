name: WEB.DE one-shot validation
on:
  push:
    branches: [validation/webde-165-20261109]
permissions:
  contents: read
jobs:
  evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/webde-165-20261109' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lane: focused
            minutes: 30
          - lane: mutations
            minutes: 60
          - lane: supplemental
            minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a7495efdf29e80a4de11b6f87eacbf3755c709d
          path: baseline
          persist-credentials: false
      - name: Verify frozen product parent
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA bf6be4d548a4a23a265c11a16ffd1fe793858be8"
          test "$(git -C candidate rev-parse 'HEAD^1^{tree}')" = "5a01e29104cf97057dbb9bbc0aa39acbe708a31f"
      - name: Scan exact validation tree and history
        if: matrix.lane == 'focused'
        timeout-minutes: 5
        working-directory: candidate
        run: sh scripts/scan-secrets.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Run the admitted evidence lane once
        env:
          WEBDE_LANE: ${{ matrix.lane }}
          WEBDE_HEAD: ${{ github.sha }}
          WEBDE_PRODUCT: bf6be4d548a4a23a265c11a16ffd1fe793858be8
          WEBDE_RUN_ATTEMPT: ${{ github.run_attempt }}
          BEND_NO_TELEMETRY: '1'
        run: python3 candidate/tests/validation/webde/driver.py
