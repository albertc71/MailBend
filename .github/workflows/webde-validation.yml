name: WEB.DE measured qualification
on:
  push:
    branches: [validation/webde-165-qualified-20261109]
permissions:
  contents: read
jobs:
  focused:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/webde-165-qualified-20261109' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a281ff1f65bac2b8e413c9f5035a5720ef7e9cae
          path: baseline
          persist-credentials: false
      - name: Verify frozen product parent
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 124dfcda14d270ff25888f0c507eda2d73adc08b"
          test "$(git -C candidate rev-parse 'HEAD^1^{tree}')" = "154d31740af308dad019d6a3e2ba4459f70669d0"
      - name: Scan exact validation tree and history
        timeout-minutes: 5
        working-directory: candidate
        run: sh scripts/scan-secrets.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Run the admitted evidence lane once
        env:
          WEBDE_LANE: focused
          WEBDE_HEAD: ${{ github.sha }}
          WEBDE_PRODUCT: 124dfcda14d270ff25888f0c507eda2d73adc08b
          WEBDE_RUN_ATTEMPT: ${{ github.run_attempt }}
          BEND_NO_TELEMETRY: '1'
        run: python3 candidate/tests/validation/webde/driver.py
  mutations:
    needs: focused
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/webde-165-qualified-20261109' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a281ff1f65bac2b8e413c9f5035a5720ef7e9cae
          path: baseline
          persist-credentials: false
      - name: Verify frozen product parent
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 124dfcda14d270ff25888f0c507eda2d73adc08b"
          test "$(git -C candidate rev-parse 'HEAD^1^{tree}')" = "154d31740af308dad019d6a3e2ba4459f70669d0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Run the admitted evidence lane once
        env:
          WEBDE_LANE: mutations
          WEBDE_HEAD: ${{ github.sha }}
          WEBDE_PRODUCT: 124dfcda14d270ff25888f0c507eda2d73adc08b
          WEBDE_RUN_ATTEMPT: ${{ github.run_attempt }}
          BEND_NO_TELEMETRY: '1'
        run: python3 candidate/tests/validation/webde/driver.py
  supplemental:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/webde-165-qualified-20261109' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a281ff1f65bac2b8e413c9f5035a5720ef7e9cae
          path: baseline
          persist-credentials: false
      - name: Verify frozen product parent
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 124dfcda14d270ff25888f0c507eda2d73adc08b"
          test "$(git -C candidate rev-parse 'HEAD^1^{tree}')" = "154d31740af308dad019d6a3e2ba4459f70669d0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Run the admitted evidence lane once
        env:
          WEBDE_LANE: supplemental
          WEBDE_HEAD: ${{ github.sha }}
          WEBDE_PRODUCT: 124dfcda14d270ff25888f0c507eda2d73adc08b
          WEBDE_RUN_ATTEMPT: ${{ github.run_attempt }}
          BEND_NO_TELEMETRY: '1'
        run: python3 candidate/tests/validation/webde/driver.py
