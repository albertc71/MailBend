name: Fuzz UTF-8 bounded review
on:
  push:
    branches:
      - verify/fuzz-utf8-369-20261109
permissions:
  contents: read
jobs:
  utf8:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Prove exact baseline, candidate and diagnostic mutations
        run: |
          timeout --signal=TERM --kill-after=5s 240s python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          
          BASE = 'c3ae808cba09fa4b599654ba633a05c940106caa'
          EXPECTED = {
              'scripts/check-fuzz-lock.py': 'db8bb77fa715db810b9800727c38df99dbd6b5d0922aecaf502ab6e2525e5fb6',
              'tests/test-fuzz-lock.py': 'eaf754d883343dafb850a71700de8c3f8d3b599b8b781ac9d3b527815ecf0eb1',
          }
          for name, expected in EXPECTED.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Unexpected bytes for {name}: {actual}')
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != BASE:
              raise SystemExit(f'Unexpected validation parent: {parent}')
          source = Path('scripts/check-fuzz-lock.py').read_text(encoding='utf-8')
          baseline = subprocess.check_output(['git', 'show', f'{BASE}:scripts/check-fuzz-lock.py']).decode('utf-8')
          handler = "        except UnicodeDecodeError as error:\n            raise ValueError(f'{path}: invalid UTF-8') from error\n"
          if source.count(handler) != 2:
              raise SystemExit('Expected exactly two reviewed UTF-8 handlers')
          if source.replace(handler, '') != baseline:
              raise SystemExit('Candidate differs from baseline beyond the two handlers')
          
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              for name in (*EXPECTED, 'native/Cargo.lock', 'native/fuzz/Cargo.lock', 'native/fuzz/Cargo.toml'):
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(name, target)
              checker = root / 'scripts/check-fuzz-lock.py'
              tests = root / 'tests/test-fuzz-lock.py'
          
              def run(label, content, failures=None):
                  checker.write_text(content, encoding='utf-8')
                  command = [sys.executable, '-B', str(tests)]
                  if failures is not None:
                      command.append('FuzzLockTests.test_invalid_utf8_diagnostic_names_each_input')
                  result = subprocess.run(command, cwd=root, capture_output=True, text=True, timeout=60)
                  print(f'{label}: status={result.returncode}', flush=True)
                  print(result.stdout, end='', flush=True)
                  print(result.stderr, end='', flush=True)
                  if failures is None:
                      if result.returncode != 0 or 'Ran 38 tests in ' not in result.stderr or not result.stderr.endswith('\nOK\n'):
                          raise SystemExit(f'{label}: expected all 38 tests to pass')
                  elif (result.returncode != 1 or 'Ran 1 test in ' not in result.stderr
                        or not result.stderr.endswith(f'\nFAILED (failures={failures})\n')):
                      raise SystemExit(f'{label}: expected exactly {failures} diagnostic assertion failures')
          
              run('baseline rejects path diagnostic regression', baseline, 9)
              run('candidate full suite', source)
              run('manifest handler omission rejected', source.replace(handler, '', 1), 3)
              before, after = source.rsplit(handler, 1)
              run('lock handler omission rejected', before + after, 6)
              run('pathless diagnostic rejected', source.replace("f'{path}: invalid UTF-8'", "'invalid UTF-8'"), 9)
              run('restored candidate full suite', source)
              result = subprocess.run([sys.executable, '-B', str(checker)], cwd=root,
                                      capture_output=True, text=True, timeout=5)
              if (result.returncode, result.stdout, result.stderr) != (
                      0, 'Shared native dependency identities and edges match the fuzz lock.\n', ''):
                  raise SystemExit('Restored candidate rejected the real repository inputs')
              print('Restored real repository inputs passed.', flush=True)
          PY
