name: Scale comparison
on:
  pull_request:
    paths:
      - tests/test-scale.py
      - tests/scale_fixtures.py
      - tests/image_fixtures.py
      - tests/fake_mail_server.py
      - tests/fake_typesafe.py
      - tests/scale-baseline.json
      - .github/workflows/scale-compare.yml
      - .github/workflows/ci.yml
permissions:
  contents: read
jobs:
  compare:
    uses: ./.github/workflows/ci.yml
    with:
      scale: true
      record_scale: false
