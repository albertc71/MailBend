name: Scale comparison
on:
  pull_request:
    paths:
      - src/image.bend
      - src/imap.bend
      - src/ops.bend
      - src/sections.bend
      - src/tools.bend
      - tests/test-scale.py
      - tests/scale_pair.py
      - tests/test-scale-pair.py
      - tests/scale_fixtures.py
      - tests/scale_support/**
      - tests/scale-baseline.json
      - tests/scale-baseline-epyc7763.json
      - tests/scale_baseline.py
      - .github/workflows/scale-compare.yml
      - .github/workflows/ci.yml
permissions:
  contents: read
jobs:
  compare:
    uses: ./.github/workflows/ci.yml
    with:
      scale: true
      record_scale: false
