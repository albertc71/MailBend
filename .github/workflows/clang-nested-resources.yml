name: Clang follow-up nested resource coverage
on:
  push:
    branches: [validation/clang-nested-resources-20261110]
permissions:
  contents: read
jobs:
  nested-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: 597697ffcd534c0d457c690565628c335c27b22a
      BEND_NO_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and scan validation overlay
        timeout-minutes: 3
        working-directory: validation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git log -1 --format='%H %T %P'
          sha256sum .github/workflows/clang-nested-resources.yml
          timeout --kill-after=5s 150s sh scripts/scan-secrets.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 597697ffcd534c0d457c690565628c335c27b22a
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and scan candidate
        timeout-minutes: 3
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git log -1 --format='%H %T %P'
          timeout --kill-after=5s 150s sh scripts/scan-secrets.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Install standard build and test dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq
          python3 -m pip install jsonschema==4.26.0
      - name: Install pinned toolchains
        timeout-minutes: 5
        working-directory: source
        run: |
          sh scripts/install-rust.sh
          sh scripts/install-bend.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Build exact candidate and record identities
        timeout-minutes: 13
        working-directory: source
        run: |
          python3 --version
          bend version
          cargo --version
          rustc --version
          clang --version
          sha256sum scripts/install.sh scripts/install-bend.sh scripts/install-rust.sh
          timeout --kill-after=10s 720s scripts/install.sh
          sha256sum bin/mailbend-core bin/mailbend-tls bin/mailbend-attach bin/mailbend-typesafe bin/mailbend-stdio
      - name: Full MIME corpus including nested resource limits
        timeout-minutes: 11
        working-directory: source
        run: timeout --kill-after=10s 600s python3 -B tests/test-mime-corpus.py --nested-resources
      - name: Verify unchanged tracked inputs
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git -C ../validation status --porcelain)"
          echo 'PASS tracked source inputs unchanged'
