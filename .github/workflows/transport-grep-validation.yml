name: Transport grep error validation
on:
  push:
    branches:
      - validation/transport-grep-20261110
permissions:
  contents: read
concurrency:
  group: transport-grep-20261110
  cancel-in-progress: false
jobs:
  sensitivity:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BEND_NO_TELEMETRY: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable source admission
        run: python3 -I validation/transport_grep.py --admit-only
      - name: Scan validation tree and available history
        timeout-minutes: 5
        run: sh scripts/scan-secrets.sh
      - name: Install transport prerequisites
        timeout-minutes: 5
        run: |
          home="$RUNNER_TEMP/transport-grep-home"
          mkdir -p "$home"
          printf 'HOME=%s\nCARGO_HOME=%s/.cargo\nRUSTUP_HOME=%s/.rustup\n' "$home" "$home" "$home" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential openssl
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Install repository-pinned Rust
        timeout-minutes: 5
        run: |
          sh scripts/install-rust.sh
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Observe complete transport regression controls
        timeout-minutes: 40
        run: |
          umask 077
          ulimit -c 0
          python3 -I validation/transport_grep.py
      - name: Supplemental MCP comparison lifecycle controls
        timeout-minutes: 3
        run: python3 tests/test-mcp-schema-comparison.py
