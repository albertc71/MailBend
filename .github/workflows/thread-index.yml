name: Thread index comparison

on:
  pull_request:
    paths:
      - src/thread.bend
      - tests/unit/thread-index.bend
      - tests/thread-support/**
      - tests/perf/thread-index.bend
      - tests/test-thread-index.py
      - .github/workflows/thread-index.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 5ff799d094fd08078391c33218dc2a9ef598494b
          path: baseline
      - name: Install pinned Bend and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang time
          sh baseline/scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check equivalence, controls and paired measurements
        env:
          BEND_NO_TELEMETRY: '1'
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I candidate/tests/test-thread-index.py --baseline baseline
