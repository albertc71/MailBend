name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BEND_NO_TELEMETRY: "1"
  # Pinned Bend release and the sha256 its official installer vouches for.
  BEND_VERSION: "2.0.32"
  BEND_SHA256: "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev clang openssl

      - name: Install Bend
        run: |
          name="bend-${BEND_VERSION}-linux-x64.tar.gz"
          tmp=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/$name" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$name"
          echo "${BEND_SHA256}  $tmp/$name" | sha256sum -c -
          tar -xzf "$tmp/$name" -C "$tmp"
          mkdir -p "$HOME/.bend/bin"
          mv "$tmp/bend/bend2" "$tmp/bend/guide" "$HOME/.bend/"
          mv "$tmp/bend/bin/bend" "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: Generated schema is up to date
        run: |
          python3 tools/gen-schema.py
          git diff --exit-code -- src/schema.bend

      - name: Safety proofs
        run: bend PROOF.bend

      - name: Unit tests
        run: sh tests/run-unit.sh

      - name: Transport tests
        run: bash tests/test-transport.sh

      - name: Build
        run: scripts/install.sh

      - name: End-to-end tests
        run: python3 tests/test-e2e.py
