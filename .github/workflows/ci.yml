name: CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_call:
    inputs:
      scale:
        type: boolean
        required: true
      record_scale:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      scale:
        description: Run the synthetic scale suite instead of ordinary CI
        type: boolean
        default: false
      record_scale:
        description: Manual evidence only (not a paired comparison or baseline acceptance)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.scale) && 'scale' || 'ci' }}
  cancel-in-progress: true
env:
  BEND_NO_TELEMETRY: '1'
jobs:
  source-checks:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan (gitleaks, redacted; tree and history)
        if: matrix.runner == 'ubuntu-24.04'
        run: sh scripts/scan-secrets.sh
      - name: Toolchain installer platform and checksum gates
        run: python3 tests/test-toolchain-installers.py
      - name: Documentation source names and drift mutations
        run: |
          python3 tools/gen-llms.py --check
          python3 tests/test-llms.py
          python3 scripts/check-docs.py
          python3 tests/test-docs.py
      - name: Unit runner scheduling and cleanup contracts
        run: python3 tests/test-unit-runner.py
      - name: Claude plugin declarations and isolated launcher fixture
        run: python3 tests/test-plugin.py
      - name: Law catalogue and public safety claims
        run: |
          python3 tools/gen-laws.py --check
          python3 tools/check-claims.py --check
          python3 tests/formal/test-claims.py
      - name: Public plan coverage and command construction
        run: |
          python3 tests/formal/check-plan-coverage.py
          python3 tests/formal/test-plan-coverage.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq time
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install result-schema test dependency
        run: python3 -m pip install jsonschema==4.26.0
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Scale harness contracts
        run: |
          python3 tests/test-scale-contract.py
          python3 -I tests/test-scale-pair.py
      - name: MCP soak verdict negative controls
        run: python3 tests/test-soak-contract.py
      - name: Selected scale baselines match source
        run: python3 tests/test-scale-baseline.py
      - name: Offline posture native egress inventory
        run: python3 tests/test-posture-inventory.py
      - name: Shared native and fuzz dependency identities
        run: |
          python3 scripts/check-fuzz-lock.py
          python3 tests/test-fuzz-lock.py
      - name: Generated schema is up to date
        run: |
          python3 tools/gen-unicode-tags.py --check
          python3 tests/test-output-schema.py
          python3 tools/gen-schema.py
          git diff --exit-code -- src/schema.bend
      - name: The SMTP envelope comes only from the allowlist
        run: |
          if grep -rnE '[A-Za-z_]\.envelope\(' --include='*.bend' src main.bend; then
            echo "envelope is called outside src/smtp.bend" >&2
            exit 1
          fi
      - name: Sends and deletes pass Jev's gates
        run: |
          flat() { cat "$@" | tr -s ' \t\n' ' '; }
          count() { grep -oE "$1" | wc -l; }
          outside=$(ls src/*.bend main.bend | grep -vxE 'src/(ops|imap)\.bend')
          if [ "$(flat src/*.bend main.bend | count '[A-Za-z_]\.outbound\(')" -ne 2 ] \
              || [ "$(flat src/jev.bend | count '[A-Za-z_]\.outbound\(')" -ne 2 ]; then
            echo "S.outbound is called other than in Jev.outbound_checked in src/jev.bend" >&2
            exit 1
          fi
          # Its definition and the one call that sends what the gate allowed.
          if [ "$(flat src/*.bend main.bend | count 'smtp_run\(')" -ne 2 ]; then
            echo "smtp_run has a caller other than the one after Jev's send gate" >&2
            exit 1
          fi
          plans=$(flat $outside | count 'plan_delete')
          gated=$(flat $outside | count 'delete_checked\( ?[a-z_]+, ?Ops\.plan_delete\(')
          if [ "$plans" -ne "$gated" ]; then
            echo "a delete plan is used without Jev.delete_checked" >&2
            exit 1
          fi
          if flat $outside | grep -qE 'Ops\.delete_uids\(|CExpunge'; then
            echo "an expunge is made outside src/ops.bend and src/imap.bend" >&2
            exit 1
          fi
      - name: Only mail_classify sends images
        run: |
          flat() { cat "$@" | tr -s ' \t\n' ' '; }
          count() { grep -oE "$1" | wc -l; }
          if [ "$(flat src/*.bend main.bend | count 'entry_images\(')" -ne 2 ] \
              || [ "$(flat src/tools.bend | count 'Jev\.entry_images\(')" -ne 1 ]; then
            echo "Jev.entry_images has a caller other than classify's image path" >&2
            exit 1
          fi
          if [ "$(flat src/*.bend main.bend | count 'Jev\.plain_cargo\( ?Jev\.outgoing_request\(')" -ne 1 ] \
              || [ "$(flat src/*.bend main.bend | count 'outgoing_request\(')" -ne 2 ]; then
            echo "the send gate's request is not a plain cargo" >&2
            exit 1
          fi
      - name: Unit tests
        run: |
          sh tests/run-unit.sh
          python3 tests/test-facts-extraction.py
      - name: Folder-status plan and evidence mutation controls
        run: python3 tests/formal/check-folder-status.py
      - name: Accepted-reply marking transition mutations
        run: python3 tests/formal/check-reply-marking.py
      - name: Client-side prompt proof mutations
        run: python3 tests/formal/check-hook.py
      - name: Image request cap and the fake TypeSafe's image rules
        run: |
          python3 tests/test-image-budget.py
          python3 tests/test-image-assets.py
          python3 tests/test-image-replies-probe.py
      - name: Bounded exhaustive search-pagination model
        run: |
          python3 tests/formal/search-pagination-model.py
          python3 tests/formal/check-search-contract-mutations.py
  # The kernel-rechecked proofs (the only steps that need Lean) and the
  # mutation checks (Bend only) run beside source-checks, not after it.
  proofs:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean (scripts/install-lean.sh, for --verdict)
        run: sh scripts/install-lean.sh
      - name: Safety proofs, rechecked by the proven kernel
        run: |
          bend PROOF.bend --verdict
          bend src/tools.bend --verdict
          bend tests/formal/tool-laws.bend --verdict
      - name: Bounded SMTP model mutation checks
        run: python3 tests/formal/check-smtp-tls.py
      - name: Role-folder resolution mutation checks
        run: python3 tests/formal/check-role-folders.py
      - name: Writing-laws guide snippets and rejected production mutation
        run: |
          python3 tests/test-writing-laws.py
          python3 tests/formal/check-writing-laws.py
  mutations:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Policy proof boundaries and mutation checks
        run: python3 tests/formal/check-policy.py
      - name: Response and image budget proof mutation checks
        run: python3 tests/formal/check-response-image-budgets.py
      - name: Literal facts proof mutation checks
        run: python3 tests/formal/check-facts.py
      - name: Change-plan and UID wire mutation checks
        run: python3 tests/formal/check-plan-wire-mutations.py
  claim-mutations:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Public safety claim mutations against the root proofs
        run: python3 tests/formal/check-law-mutations.py
  runtime:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        suite:
          - cli
          - mcp
          - support
          - soak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install result-schema test dependency
        run: python3 -m pip install jsonschema==4.26.0
      - name: Install Rust 1.99 (native/rust-toolchain.toml)
        run: |
          sh scripts/install-rust.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Transport tests
        run: bash tests/test-transport.sh
        if: matrix.suite == 'support'
      - name: Build
        run: scripts/install.sh
      - name: Installed native ELF hardening and negative controls
        if: matrix.suite == 'support'
        run: |
          python3 scripts/check-native-hardening.py
          python3 tests/test-native-hardening.py
      - name: MIME and internationalisation corpus
        if: matrix.suite == 'support'
        run: python3 tests/test-mime-corpus.py
      - name: Compromised-agent incident matrix
        run: python3 tests/test-incidents.py
        if: matrix.suite == 'support'
      - name: Installer staging, locking, signals and fallback warnings
        run: python3 tests/test-install.py
        if: matrix.suite == 'support'
      - name: Installer swap fault injection
        run: python3 tests/formal/check-install-swap.py
        if: matrix.suite == 'support'
      - name: Cloud DNS and TLS tests
        run: python3 tests/test-cloud-network.py
        if: matrix.suite == 'support'
      - name: Outgoing clock failure boundaries
        run: python3 tests/test-clock.py
        if: matrix.suite == 'support'
      - name: Offline posture boundary and redaction
        run: python3 tests/test-posture.py
        if: matrix.suite == 'support'
      - name: MCP inherited-descriptor and lifecycle tests
        run: python3 tests/test-stdio.py
        if: matrix.suite == 'support'
      - name: Credential-free demo boundaries and MCP flow
        run: python3 tests/test-demo.py
        if: matrix.suite == 'support'
      - name: CLI end-to-end tests
        if: matrix.suite == 'cli'
        run: |
          python3 tests/test-cli-tools.py
          python3 tests/test-hook.py
          python3 tests/test-facts.py
          python3 tests/test-search-flags.py
          python3 tests/test-e2e.py
      - name: Short synthetic MCP soak
        if: matrix.suite == 'soak'
        timeout-minutes: 6
        run: python3 tests/test-soak.py --profile short
      - name: Structured MCP tool scenarios
        if: matrix.suite == 'mcp'
        run: |
          python3 tests/test-plugin.py --runtime
          MAILBEND_TEST_MCP=1 python3 tests/test-facts.py
          MAILBEND_TEST_MCP=1 python3 tests/test-search-flags.py
          MAILBEND_TEST_MCP=1 python3 tests/test-e2e.py --tool-scenarios-only
      - name: Integrated results and scheduled recipes
        if: matrix.suite == 'support'
        run: |-
          python3 tests/test-integrated-results.py
          python3 tests/test-scheduled-recipes.py
  rust:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.99 (the MSRV, native/rust-toolchain.toml)
        run: |
          sh ../scripts/install-rust.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Folder-status capability conjunction mutation
        run: python3 ../tests/formal/check-folder-status.py --native
      - name: No way around TLS verification
        run: |
          if grep -rnE 'dangerous\(|client::danger|ServerCertVerifier' --include='*.rs' .; then
            echo "TLS verification must not be configurable" >&2
            exit 1
          fi
      - name: Attachment and stdio helpers have no network or TLS crate
        run: |
          cargo tree --locked -p mailbend-attach -e normal --prefix none > "$RUNNER_TEMP/attach-tree.txt"
          if grep -E '^(rustls|ring|socket2|mio|tokio|hyper|ureq|reqwest|curl|openssl)[ -]' "$RUNNER_TEMP/attach-tree.txt"; then
            echo "mailbend-attach must not depend on network or TLS crates" >&2
            exit 1
          fi
          if grep -rnE 'std::net|TcpStream|UdpSocket|UnixStream' mailbend-attach/src; then
            echo "mailbend-attach must not open network sockets" >&2
            exit 1
          fi
          cargo tree --locked -p mailbend-stdio -e normal --prefix none > "$RUNNER_TEMP/stdio-tree.txt"
          if grep -E '^(rustls|ring|socket2|mio|tokio|hyper|ureq|reqwest|curl|openssl)[ -]' "$RUNNER_TEMP/stdio-tree.txt"; then
            echo "mailbend-stdio must not depend on network or TLS crates" >&2
            exit 1
          fi
          if grep -rnE 'std::net|TcpStream|UdpSocket|UnixStream|socket\(' mailbend-stdio/src; then
            echo "mailbend-stdio must only use inherited descriptors" >&2
            exit 1
          fi
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Dependency policy (cargo-deny)
        run: cargo deny --log-level warn --all-features check
  fuzz:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzzing only)
        run: rustup toolchain install nightly-2026-10-06 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-06 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each parser for 60 seconds
        run: |
          for target in imap_script imap_response smtp_envelope smtp_reply dns_answer http_response url_and_proxy; do
            cargo +nightly-2026-10-06 fuzz run "$target" -O -- -max_total_time=60
          done
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - source-checks
      - proofs
      - mutations
      - claim-mutations
      - runtime
      - rust
      - fuzz
    if: ${{ always() && github.event_name != 'schedule' && !inputs.scale }}
    steps:
      - name: Every required lane passed
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          PROOFS_RESULT: ${{ needs.proofs.result }}
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
          CLAIM_MUTATIONS_RESULT: ${{ needs.claim-mutations.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          set -eu
          test "$SOURCE_RESULT" = success
          test "$PROOFS_RESULT" = success
          test "$MUTATIONS_RESULT" = success
          test "$CLAIM_MUTATIONS_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$RUST_RESULT" = success
          test "$FUZZ_RESULT" = success

  scale:
    if: github.event_name == 'schedule' || inputs.scale
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse evidence-only mode outside explicit manual dispatch
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$RECORD_SCALE" = true ] && [ "$EVENT_NAME" != workflow_dispatch ]; then
            echo 'Evidence recording cannot replace a paired comparison.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Checkout the immutable reviewed reference
        if: ${{ !inputs.record_scale }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 8ae04b1b3c773d14dea78e167e0047adab1e7cb5
          path: reference
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl time
          rustup toolchain install 1.99 --profile minimal
      - name: Install the pinned scale Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Fetch the named immutable reference tag without moving it
        if: ${{ !inputs.record_scale }}
        run: |
          git -C reference fetch --no-tags origin tag scale-reference-v1
          git -C candidate fetch --no-tags origin tag scale-reference-v1
      - name: Validate paired sources and immutable apparatus before building
        if: ${{ !inputs.record_scale }}
        run: |
          python3 -I candidate/tests/scale_pair.py preflight --reference "$GITHUB_WORKSPACE/reference" --candidate "$GITHUB_WORKSPACE/candidate" --candidate-sha "$CANDIDATE_SHA" --output-dir "$GITHUB_WORKSPACE/scale-results"
      - name: Install the verified pinned Bend toolchain
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
        run: |
          if [ "$RECORD_SCALE" = true ]; then
            sh candidate/scripts/install-bend.sh
          else
            sh reference/scripts/install-bend.sh
          fi
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Build the reference in its own tree
        if: ${{ !inputs.record_scale }}
        run: reference/scripts/install.sh
      - name: Build the candidate in its own tree
        run: candidate/scripts/install.sh
      - name: Check contracts and capture exact paired build identities
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
        run: |
          python3 candidate/tests/test-scale-contract.py
          python3 -I candidate/tests/test-scale-pair.py
          mkdir -p scale-results
          if [ "$RECORD_SCALE" != true ]; then
            python3 -I candidate/tests/scale_pair.py identities --reference "$GITHUB_WORKSPACE/reference" --candidate "$GITHUB_WORKSPACE/candidate" --candidate-sha "$CANDIDATE_SHA" --output-dir "$GITHUB_WORKSPACE/scale-results"
          fi
      - name: Interleave fixed-reference and candidate sample pairs
        if: ${{ !inputs.record_scale }}
        timeout-minutes: 31
        run: |
          python3 -I candidate/tests/scale_pair.py run --reference "$GITHUB_WORKSPACE/reference" --candidate "$GITHUB_WORKSPACE/candidate" --candidate-sha "$CANDIDATE_SHA" --output-dir "$GITHUB_WORKSPACE/scale-results"
      - name: Manual evidence recording only (not a comparison)
        if: ${{ inputs.record_scale && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 16
        run: python3 candidate/tests/test-scale.py --record --output "$GITHUB_WORKSPACE/scale-results/candidate-results.json"
      - name: Log complete reports and identities, including failed runs
        if: always()
        run: |
          log_error=0
          for name in paired-identities reference-results candidate-results paired-result; do
            file="scale-results/$name.json"
            if [ -f "$file" ]; then
              # Refuse oversized output rather than silently truncating evidence.
              if [ "$(wc -c < "$file")" -gt 1048576 ]; then
                echo "Report too large to emit completely: $file" >&2
                log_error=1
                continue
              fi
              sha256sum "$file"
              printf '%s\n' "SCALE_${name}_JSON_BEGIN"
              cat "$file"
              printf '\n%s\n' "SCALE_${name}_JSON_END"
            else
              printf 'No %s report was produced.\n' "$name"
            fi
          done
          exit "$log_error"

