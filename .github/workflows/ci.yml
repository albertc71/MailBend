name: CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      scale:
        description: Run the synthetic scale suite instead of ordinary CI
        type: boolean
        default: false
      record_scale:
        description: Record a candidate baseline without comparing or replacing the committed baseline
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.scale) && 'scale' || 'ci' }}
  cancel-in-progress: true
env:
  BEND_NO_TELEMETRY: '1'
jobs:
  source-checks:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan (gitleaks, redacted; tree and history)
        run: sh scripts/scan-secrets.sh
      - name: Documentation source names and drift mutations
        run: |
          python3 scripts/check-docs.py
          python3 tests/test-docs.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq time
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install result-schema test dependency
        run: python3 -m pip install jsonschema==4.26.0
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Scale harness contracts
        run: python3 tests/test-scale-contract.py
      - name: Offline posture native egress inventory
        run: python3 tests/test-posture-inventory.py
      - name: Generated schema is up to date
        run: |
          python3 tools/gen-unicode-tags.py --check
          python3 tests/test-output-schema.py
          python3 tools/gen-schema.py
          git diff --exit-code -- src/schema.bend
      - name: The SMTP envelope comes only from the allowlist
        run: |
          if grep -rnE '[A-Za-z_]\.envelope\(' --include='*.bend' src main.bend; then
            echo "envelope is called outside src/smtp.bend" >&2
            exit 1
          fi
      - name: Sends and deletes pass Jev's gates
        run: |
          flat() { cat "$@" | tr -s ' \t\n' ' '; }
          count() { grep -oE "$1" | wc -l; }
          outside=$(ls src/*.bend main.bend | grep -vxE 'src/(ops|imap)\.bend')
          if [ "$(flat src/*.bend main.bend | count '[A-Za-z_]\.outbound\(')" -ne 2 ] \
              || [ "$(flat src/jev.bend | count '[A-Za-z_]\.outbound\(')" -ne 2 ]; then
            echo "S.outbound is called other than in Jev.outbound_checked in src/jev.bend" >&2
            exit 1
          fi
          # Its definition and the one call that sends what the gate allowed.
          if [ "$(flat src/*.bend main.bend | count 'smtp_run\(')" -ne 2 ]; then
            echo "smtp_run has a caller other than the one after Jev's send gate" >&2
            exit 1
          fi
          plans=$(flat $outside | count 'plan_delete')
          gated=$(flat $outside | count 'delete_checked\( ?[a-z_]+, ?Ops\.plan_delete\(')
          if [ "$plans" -ne "$gated" ]; then
            echo "a delete plan is used without Jev.delete_checked" >&2
            exit 1
          fi
          if flat $outside | grep -qE 'Ops\.delete_uids\(|CExpunge'; then
            echo "an expunge is made outside src/ops.bend and src/imap.bend" >&2
            exit 1
          fi
      - name: Only mail_classify sends images
        run: |
          flat() { cat "$@" | tr -s ' \t\n' ' '; }
          count() { grep -oE "$1" | wc -l; }
          if [ "$(flat src/*.bend main.bend | count 'entry_images\(')" -ne 2 ] \
              || [ "$(flat src/tools.bend | count 'Jev\.entry_images\(')" -ne 1 ]; then
            echo "Jev.entry_images has a caller other than classify's image path" >&2
            exit 1
          fi
          if [ "$(flat src/*.bend main.bend | count 'Jev\.plain_cargo\( ?Jev\.outgoing_request\(')" -ne 1 ] \
              || [ "$(flat src/*.bend main.bend | count 'outgoing_request\(')" -ne 2 ]; then
            echo "the send gate's request is not a plain cargo" >&2
            exit 1
          fi
      - name: Install Lean (scripts/install-lean.sh, for --verdict)
        run: sh scripts/install-lean.sh
      - name: Safety proofs, rechecked by the proven kernel
        run: |
          bend PROOF.bend --verdict
          bend src/tools.bend --verdict
          bend tests/formal/tool-laws.bend --verdict
      - name: Bounded SMTP model mutation checks
        run: python3 tests/formal/check-smtp-tls.py
      - name: Policy proof boundaries and mutation checks
        run: python3 tests/formal/check-policy.py
      - name: Role-folder resolution mutation checks
        run: python3 tests/formal/check-role-folders.py
      - name: Writing-laws guide snippets and rejected production mutation
        run: |
          python3 tests/test-writing-laws.py
          python3 tests/formal/check-writing-laws.py
      - name: Change-plan and UID wire mutation checks
        run: python3 tests/formal/check-plan-wire-mutations.py
      - name: Unit tests
        run: sh tests/run-unit.sh
      - name: Image request cap and the fake TypeSafe's image rules
        run: |
          python3 tests/test-image-budget.py
          python3 tests/test-image-assets.py
      - name: Bounded exhaustive search-pagination model
        run: |
          python3 tests/formal/search-pagination-model.py
          python3 tests/formal/check-search-contract-mutations.py
  runtime:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - cli
          - mcp
          - support
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl jq
      - name: Install Python with the adjacent encoded-word parser fix
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install result-schema test dependency
        run: python3 -m pip install jsonschema==4.26.0
      - name: Install Rust 1.99 (native/rust-toolchain.toml)
        run: rustup toolchain install 1.99 --profile minimal
      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Transport tests
        run: bash tests/test-transport.sh
        if: matrix.suite == 'support'
      - name: Build
        run: scripts/install.sh
      - name: MIME and internationalisation corpus
        if: matrix.suite == 'support'
        run: python3 tests/test-mime-corpus.py
      - name: Compromised-agent incident matrix
        run: python3 tests/test-incidents.py
        if: matrix.suite == 'support'
      - name: Installer staging, locking, signals and fallback warnings
        run: python3 tests/test-install.py
        if: matrix.suite == 'support'
      - name: Installer swap fault injection
        run: python3 tests/formal/check-install-swap.py
        if: matrix.suite == 'support'
      - name: Cloud DNS and TLS tests
        run: python3 tests/test-cloud-network.py
        if: matrix.suite == 'support'
      - name: Offline posture boundary and redaction
        run: python3 tests/test-posture.py
        if: matrix.suite == 'support'
      - name: MCP inherited-descriptor and lifecycle tests
        run: python3 tests/test-stdio.py
        if: matrix.suite == 'support'
      - name: CLI end-to-end tests
        if: matrix.suite == 'cli'
        run: python3 tests/test-e2e.py
      - name: Structured MCP tool scenarios
        if: matrix.suite == 'mcp'
        run: MAILBEND_TEST_MCP=1 python3 tests/test-e2e.py --tool-scenarios-only
      - name: Integrated results and scheduled recipes
        if: matrix.suite == 'support'
        run: |-
          python3 tests/test-integrated-results.py
          python3 tests/test-scheduled-recipes.py
  rust:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.99 (the MSRV, native/rust-toolchain.toml)
        run: rustup toolchain install 1.99 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: No way around TLS verification
        run: |
          if grep -rnE 'dangerous\(|client::danger|ServerCertVerifier' --include='*.rs' .; then
            echo "TLS verification must not be configurable" >&2
            exit 1
          fi
      - name: Attachment and stdio helpers have no network or TLS crate
        run: |
          cargo tree --locked -p mailbend-attach -e normal --prefix none > "$RUNNER_TEMP/attach-tree.txt"
          if grep -E '^(rustls|ring|socket2|mio|tokio|hyper|ureq|reqwest|curl|openssl)[ -]' "$RUNNER_TEMP/attach-tree.txt"; then
            echo "mailbend-attach must not depend on network or TLS crates" >&2
            exit 1
          fi
          if grep -rnE 'std::net|TcpStream|UdpSocket|UnixStream' mailbend-attach/src; then
            echo "mailbend-attach must not open network sockets" >&2
            exit 1
          fi
          cargo tree --locked -p mailbend-stdio -e normal --prefix none > "$RUNNER_TEMP/stdio-tree.txt"
          if grep -E '^(rustls|ring|socket2|mio|tokio|hyper|ureq|reqwest|curl|openssl)[ -]' "$RUNNER_TEMP/stdio-tree.txt"; then
            echo "mailbend-stdio must not depend on network or TLS crates" >&2
            exit 1
          fi
          if grep -rnE 'std::net|TcpStream|UdpSocket|UnixStream|socket\(' mailbend-stdio/src; then
            echo "mailbend-stdio must only use inherited descriptors" >&2
            exit 1
          fi
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Dependency policy (cargo-deny)
        run: cargo deny --log-level warn --all-features check
  fuzz:
    if: ${{ github.event_name != 'schedule' && !inputs.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned nightly (fuzzing only)
        run: rustup toolchain install nightly-2026-10-06 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-06 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each parser for 60 seconds
        run: |
          for target in imap_script imap_response smtp_envelope smtp_reply dns_answer http_response url_and_proxy; do
            cargo +nightly-2026-10-06 fuzz run "$target" -O -- -max_total_time=60
          done
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - source-checks
      - runtime
      - rust
      - fuzz
    if: ${{ always() && github.event_name != 'schedule' && !inputs.scale }}
    steps:
      - name: Every required lane passed
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          set -eu
          test "$SOURCE_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$RUST_RESULT" = success
          test "$FUZZ_RESULT" = success

  scale:
    if: github.event_name == 'schedule' || inputs.scale
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl time
          rustup toolchain install 1.99 --profile minimal
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Build the pinned compiled core
        run: scripts/install.sh
      - name: Measure only local synthetic workloads
        timeout-minutes: 16
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
        run: |
          python3 tests/test-scale-contract.py
          if [ "$RECORD_SCALE" = true ]; then
            python3 tests/test-scale.py --record --output scale-results.json
          else
            python3 tests/test-scale.py --output scale-results.json
          fi
      - name: Log measurements, including failed and incomplete runs
        if: always()
        run: |
          if [ -f scale-results.json ]; then
            sha256sum scale-results.json
            printf '%s\n' SCALE_RESULT_JSON_BEGIN
            cat scale-results.json
            printf '%s\n' SCALE_RESULT_JSON_END
          else
            echo "No scale result was produced."
          fi
