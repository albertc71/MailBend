name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BEND_NO_TELEMETRY: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libcurl4-openssl-dev clang openssl

      - name: Install Bend
        run: |
          sh scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: Generated schema is up to date
        run: |
          python3 tools/gen-schema.py
          git diff --exit-code -- src/schema.bend

      - name: Safety proofs
        run: bend PROOF.bend

      - name: Unit tests
        run: sh tests/run-unit.sh

      - name: Transport tests
        run: bash tests/test-transport.sh

      - name: Build
        run: scripts/install.sh

      - name: Cloud DNS and TLS tests
        run: python3 tests/test-cloud-network.py

      - name: End-to-end tests
        run: python3 tests/test-e2e.py
