name: Foundation paired scale gate
on:
  workflow_call:
    inputs:
      scale:
        type: boolean
        required: true
      record_scale:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-scale
  cancel-in-progress: true
env:
  BEND_NO_TELEMETRY: '1'
jobs:
  scale:
    if: github.event_name == 'schedule' || inputs.scale
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse evidence-only mode outside explicit manual dispatch
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$RECORD_SCALE" = true ] && [ "$EVENT_NAME" != workflow_dispatch ]; then
            echo 'Evidence recording cannot replace a paired comparison.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Checkout the reviewed paired gate independently of the product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: bca8aa63067c7d302d07567dd0dd1ee00fde876f
          path: control
      - name: Verify immutable control source identity
        run: |
          test "$(git -C control rev-parse HEAD)" = bca8aa63067c7d302d07567dd0dd1ee00fde876f
          printf '%s\n' '1aaa079d241ca7b537d20c4c2fa4bfcb863dd3ba7e5e2686b3de44964ff07f3b  control/tests/scale_pair.py' | sha256sum --check
      - name: Checkout the immutable reviewed reference
        if: ${{ !inputs.record_scale }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 8ae04b1b3c773d14dea78e167e0047adab1e7cb5
          path: reference
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang openssl time
          rustup toolchain install 1.99 --profile minimal
      - name: Install the pinned scale Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Fetch the named immutable reference tag without moving it
        if: ${{ !inputs.record_scale }}
        run: |
          git -C reference fetch --no-tags origin tag scale-reference-v1
          git -C candidate fetch --no-tags origin tag scale-reference-v1
      - name: Validate paired sources and immutable apparatus before building
        if: ${{ !inputs.record_scale }}
        run: |
          python3 -I control/tests/scale_pair.py preflight --reference "$GITHUB_WORKSPACE/reference" --candidate "$GITHUB_WORKSPACE/candidate" --candidate-sha "$CANDIDATE_SHA" --output-dir "$GITHUB_WORKSPACE/scale-results"
      - name: Install the verified pinned Bend toolchain
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
        run: |
          if [ "$RECORD_SCALE" = true ]; then
            sh candidate/scripts/install-bend.sh
          else
            sh reference/scripts/install-bend.sh
          fi
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Build the reference in its own tree
        if: ${{ !inputs.record_scale }}
        run: reference/scripts/install.sh
      - name: Build the candidate in its own tree
        run: candidate/scripts/install.sh
      - name: Check contracts and capture exact paired build identities
        env:
          RECORD_SCALE: ${{ inputs.record_scale }}
        run: |
          python3 candidate/tests/test-scale-contract.py
          python3 -I control/tests/test-scale-pair.py
          mkdir -p scale-results
          if [ "$RECORD_SCALE" != true ]; then
            python3 -I control/tests/scale_pair.py identities --reference "$GITHUB_WORKSPACE/reference" --candidate "$GITHUB_WORKSPACE/candidate" --candidate-sha "$CANDIDATE_SHA" --output-dir "$GITHUB_WORKSPACE/scale-results"
          fi
      - name: Interleave fixed-reference and candidate sample pairs
        if: ${{ !inputs.record_scale }}
        timeout-minutes: 31
        run: |
          python3 -I control/tests/scale_pair.py run --reference "$GITHUB_WORKSPACE/reference" --candidate "$GITHUB_WORKSPACE/candidate" --candidate-sha "$CANDIDATE_SHA" --output-dir "$GITHUB_WORKSPACE/scale-results"
      - name: Manual evidence recording only (not a comparison)
        if: ${{ inputs.record_scale && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 16
        run: python3 candidate/tests/test-scale.py --record --output "$GITHUB_WORKSPACE/scale-results/candidate-results.json"
      - name: Log complete reports and identities, including failed runs
        if: always()
        run: |
          log_error=0
          for name in paired-identities reference-results candidate-results paired-result; do
            file="scale-results/$name.json"
            if [ -f "$file" ]; then
              # Refuse oversized output rather than silently truncating evidence.
              if [ "$(wc -c < "$file")" -gt 1048576 ]; then
                echo "Report too large to emit completely: $file" >&2
                log_error=1
                continue
              fi
              sha256sum "$file"
              printf '%s\n' "SCALE_${name}_JSON_BEGIN"
              cat "$file"
              printf '\n%s\n' "SCALE_${name}_JSON_END"
            else
              printf 'No %s report was produced.\n' "$name"
            fi
          done
          exit "$log_error"
