name: Pacing compiler abort diagnostic
on:
  push:
    branches: [validation/pacing-159-diagnostic-v8b-20261110]
permissions:
  contents: read
jobs:
  pure:
    if: ${{ github.run_attempt == 1 && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolate fresh pinned kernel and toolchains
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          home=$(mktemp -d "$RUNNER_TEMP/pacing-home.XXXXXX")
          test ! -e "$home/.bend/bendtt"
          printf "HOME=%s\nELAN_HOME=%s/.elan\nBENDTT=\n" "$home" "$home" >> "$GITHUB_ENV"
      - name: Bind exact source and inherited executable inputs
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = '1917efa577286ae6709a9af686d1478d71f691f8'
          git rev-parse HEAD HEAD^{tree}
          printf '%s\n' '.github/workflows/pacing-diagnostic.yml' 'validation/pacing-diagnostic.sh' > /tmp/pacing-expected-paths
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort > /tmp/pacing-actual-paths
          cmp /tmp/pacing-expected-paths /tmp/pacing-actual-paths
          test "$(git hash-object scripts/install-bend.sh)" = 007205e91c9a034d24c7dafadfbbd70e2ffe17e0
          test "$(git hash-object scripts/install-lean.sh)" = 6afb088e92b87e708a6ba70b31dcaa93a5730b22
          test "$(git hash-object scripts/scan-secrets.sh)" = 6d6648ae0d07d16b40d471f3de6e3f71dbef7879
          test "$(git hash-object .gitleaks.toml)" = 740df730ca9f003b2198f5a01623bb7d2baefa7e
          printf '%s\n' '912c7979f68310ad6d83471ccff9ffb826211ef2c5d11abaca5a562bc604111d  src/pacing.bend' '9849fe54841b25e2bc41eae5e321cb1a303ec1e627359adfaba92713c1edef5e  tests/formal/pacing-laws.bend' 'e8c03ec813b0aa96fe98e0d8d2aa2d404ed8c464cc55849cdfd5bc49cd361743  tests/unit/pacing.bend' '78923e5e38f65747f88cc2f6cb0b1f24f7d32b8634aaa47d9991afd0bb4585a1  validation/pacing-pure.sh' '213214faed0c42e3082f91daf26af1a58f8708848bd8d2dc821be74dc286caa7  validation/pacing-diagnostic.sh' | sha256sum -c -
      - name: Exact checkout and available-history redacted scans
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 165s sh scripts/scan-secrets.sh
      - name: Require installed debugger and Python without loading a target
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/gdb
          export DEBUGINFOD_URLS=
          timeout --signal=TERM --kill-after=5s 20s bash -c '
            set -euo pipefail
            ulimit -t 10
            ulimit -v 3145728
            ulimit -f 16384
            ulimit -c 0
            exec /usr/bin/gdb --batch --nx --nh -iex "set auto-load off" -iex "set debuginfod enabled off" -ex "set startup-with-shell off" -ex "set disable-randomization off" -ex "python import gdb; print(gdb.VERSION)"
          '
      - name: Pinned toolchains, one bounded bootstrap
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 340s bash -c 'sh scripts/install-bend.sh && sh scripts/install-lean.sh'
          "$HOME/.bend/bin/bend" version
          ELAN_TOOLCHAIN=leanprover/lean4:v4.34.0 ELAN_AUTO_INSTALL=0 "$HOME/.elan/bin/lean" --version
      - name: One compiler diagnostic, no generated execution
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=10s 340s bash validation/pacing-diagnostic.sh
