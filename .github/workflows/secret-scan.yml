name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token; no mail credentials; no write scopes.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        run: |
          set -euo pipefail
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$name"
          echo "${GITLEAKS_SHA256}  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Scan repository history (redacted report)
        run: |
          set -euo pipefail
          # gitleaks redacts secrets in its default output; exit 1 on findings.
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
