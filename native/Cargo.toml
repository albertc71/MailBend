[workspace]
resolver = "3"
members = ["mailbend-attach", "mailbend-io", "mailbend-net", "mailbend-tls"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# One version of each dependency for the whole workspace.
[workspace.dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
mailbend-io = { path = "mailbend-io" }
mailbend-net = { path = "mailbend-net" }
nix = { version = "0.31.3", default-features = false, features = ["fs", "user"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
